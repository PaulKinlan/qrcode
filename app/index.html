<!doctype html>
<html lang="en-GB">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capture QR Code</title>
  <!-- 'wasm-unsafe-eval' is what lets THIS document compile the ZBar binary: without it every
       WebAssembly compile in a page is refused (CompileError), which is invisible today only
       because workers do not inherit a meta CSP and the decode runs in app/scripts/qrworker.js.
       Serving the same policy as an HTTP header (inherited by workers) would silently kill
       scanning (bead qrcode-2pt).

       No 'unsafe-inline': every script here is a same-origin URL. The service-worker
       registration used to be an inline block and was the only reason the policy needed it, so
       it now lives in /scripts/sw-register.js (bead qrcode-3bc).
       test/build/dist-artifacts.test.mjs fails the build if an inline <script> comes back. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; object-src 'none'; base-uri 'none'; img-src 'self' data: blob:; connect-src 'self'">
  <meta name="description" content="Instantly snap QR codes on mobile and desktop without installing an app.">

  <!-- Add to homescreen -->
  <link rel="manifest" href="/manifest.json">

  <!-- Fallback to homescreen for Chrome <39 on Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Snap QR Code">
  <link rel="icon" sizes="192x192" href="/images/touch/chrome-touch-icon-192x192.png">

  <!-- Add to homescreen for Safari on iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Capture QR Code">
  <link rel="apple-touch-icon" href="/images/touch/apple-touch-icon.png">

  <!-- Tile icon for Win8 (144x144 + tile color) -->
  <meta name="msapplication-TileImage" content="/images/touch/ms-touch-icon-144x144-precomposed.png">
  <meta name="msapplication-TileColor" content="#212121">

  <!-- Origin Trial Token, feature = Shape Detection API, origin = https://qrsnapper.com, expires = 2018-11-05 -->
  <meta http-equiv="origin-trial" data-feature="Shape Detection API" data-expires="2018-11-05"
    content="Ask9b8eaymdcPPFq0xVl/GH4DVDZnMhMiffYEexo9/LiOL21SHQQkToqpAozpULepkOaPlnv8RegP813aA2XAwEAAABVeyJvcmlnaW4iOiJodHRwczovL3Fyc25hcHBlci5jb206NDQzIiwiZmVhdHVyZSI6IlNoYXBlRGV0ZWN0aW9uIiwiZXhwaXJ5IjoxNTQxNDI1NDE1fQ==">

  <meta name="theme-color" content="#212121">
  <link rel="stylesheet" href="/styles/app.css">
  <script src="/scripts/main.js" type="module"></script>
</head>

<body>

  <div class="wsk-layout">
    <div class="wsk-layout__content">
      <div id="camera" class="Camera">
        <canvas class="Camera-display"></canvas>
        <!-- The only route to the About dialog must be real UI: a <button> is focusable, activates
             on Enter/Space and carries an accessible name (bead qrcode-e4c). The svg inside is
             decorative (alt=""); the button's aria-label names the control. -->
        <button type="button" class="about" aria-label="About QR Snapper">
          <img src="/images/help_outline-24px.svg" alt="" />
        </button>
        <div class="CameraRealtime hidden">
          <video class="Camera-video" muted autoplay playsinline></video>
          <div class="Camera-instructions">Point at a QR code</div>
          <div class="Camera-toggle wsk-button wsk-button--fab">
            <input type="checkbox" id="checkbox-1" class="Camera-toggle-input" />
            <label for="checkbox-1">
              <img class="front" src="/images/ic_camera_front_24px.svg">
              <img class="rear" src="/images/ic_camera_rear_24px.svg">
            </label>
          </div>
        </div>
        <div class="Camera-overlay"></div>
        <p id="camera-error" role="alert" hidden>Scanning failed. Please try again.</p>
        <div id="camera-fallback" class="CameraFallback hidden">
          <form method="post" action="/scan-image" class="CameraFallback-form">
            <input type="file" accept="image/*" capture="camera" id="qrcode-input" name="qrcode"
              class="CameraFallback-input">
            <label for="qrcode-input"><img src="/images/ic_file_upload_24px.svg"></label>
            <img class="CameraFallback-image">
          </form>
        </div>
      </div>
      <div id="qrcode" class="wsk-card wsk-shadow--z3 QRCodeSuccessDialog">
        <div class="wsk-card--heading">
          <span class="wsk-card--heading-text">QR Code found</span>
        </div>
        <div class="wsk-card--lower QRCodeSuccessDialog-data">
        </div>
        <div class="wsk-card--bottom">
          <div>
            <button class="wsk-button QRCodeSuccessDialog-ignore">Ignore</button>
            <button class="wsk-button QRCodeSuccessDialog-navigate">Open</button>
            <button class="wsk-button QRCodeSuccessDialog-callback hidden">
              <div class="QRCodeSuccessDialogCallback-name">Return</div>
              <div class="QRCodeSuccessDialogCallback-domain"></div>
            </button>
            <button class="wsk-button QRCodeSuccessDialog-copy hidden">Copy</button>
            <button class="wsk-button QRCodeSuccessDialog-share hidden">Share</button>
          </div>
        </div>
      </div>
      <!-- About Dialog. role=dialog + aria-labelledby so AT announces it as a named dialog
             when focus moves in (bead qrcode-e4c). It is deliberately NOT aria-modal: no
             focus trap is implemented, so background content stays reachable. -->
      <div id="about" class="wsk-card wsk-shadow--z3 QRCodeAboutDialog" role="dialog" aria-labelledby="about-heading">
        <div class="wsk-card--heading">
          <span class="wsk-card--heading-text" id="about-heading">About QR Snapper</span>
        </div>
        <div class="wsk-card--lower QRCodeAboutDialog-data">
          <p>QR Snapper is the simplest to use QR Scanner available on the web.</p>
          <p>If you would like to learn how it was built, visit <a
              href="https://paul.kinlan.me/projects/qrsnapper/">Paul Kinlan's site</a>.</p>
          <p>The code is also available on <a href="https://github.com/PaulKinlan/qrcode/">Github</a>.</p>
        </div>
        <div class="wsk-card--bottom">
          <div>
            <button class="wsk-button QRCodeAboutDialog-close">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Registration must stay in an external file: the CSP above allows no inline script. -->
  <script src="/scripts/sw-register.js"></script>
</body>

</html>
