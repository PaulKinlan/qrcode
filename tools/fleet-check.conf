# fleet-check gate contract for qrcode (PaulKinlan/qrcode).
#
# This VM is qrcode-only, so this file is the machine-global ~/.fleet/check.conf. It lives in
# the repo as well because the machine file is machine state: if it is rebuilt or lost, every
# landing silently gets no gate (fleet-check --status answers NONE). Copy it back with:
#
#   cp tools/fleet-check.conf ~/.fleet/check.conf
#
# The repo scripts are the source of truth (see the ADR bead qrcode-vyq):
#   fast tier  npm run test:fast  = vite build + node --test over pure modules only
#   full tier  npm test           = the fast tier + post-build dist/ assertions
# Both tiers are seconds-fast; the browser smoke that drives the file-upload path is a
# separate follow-up tier (bead qrcode-cf0), which is why the full tier is not yet a superset
# by much. The fast tier is a strict subset of the full tier (speed.md R2).
#
# Budgets (speed.md): R1 full <= 300s, R2 fast <= 60s. Measured 2026-10-17 on this VM:
# full 2.7s wall (build 1.7s + 14 tests 0.35s), fast 2.5s.
CHECK_CMD="npm test"
CHECK_FAST_CMD="npm run test:fast"
CHECK_TIMEOUT=300
CHECK_FAST_TIMEOUT=180
