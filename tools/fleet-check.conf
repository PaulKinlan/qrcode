# fleet-check gate contract for qrcode (PaulKinlan/qrcode).
#
# This VM is qrcode-only, so this file is the machine-global ~/.fleet/check.conf. It lives in
# the repo as well because the machine file is machine state: if it is rebuilt or lost, every
# landing silently gets no gate (fleet-check --status answers NONE). Copy it back with:
#
#   cp tools/fleet-check.conf ~/.fleet/check.conf
#
# The repo scripts are the source of truth (see the ADR bead qrcode-vyq), and package.json is
# what they implement:
#   fast tier  npm run test:fast  = vite build + node --test over test/unit/** (pure modules:
#                                   no DOM, no server, no network, no browser)
#   full tier  npm test           = those unit tests + test/build/** (post-build dist/
#                                   assertions) + test/browser/** (headless Chrome smoke)
# The fast tier is a strict subset of the full tier (speed.md R2). Both tiers are
# seconds-fast, but the full tier does launch a browser: since bead qrcode-cf0 landed,
# test/browser/smoke.test.mjs serves dist/ on an ephemeral port, drives the camera-free
# file-upload path in headless Chrome with a committed QR fixture, and asserts the decoded
# payload, the service-worker precache and an offline reload. It is hermetic (it fails every
# off-origin request itself, so the tier needs no network), and it carries its own 120s
# node:test timeout, so a hung Chrome cannot consume the R1 budget: CHECK_TIMEOUT below is
# only the outer ceiling. QR_SNAPPER_NO_BROWSER=1 skips the browser file deliberately (for a
# box with no Chrome); the gate must never set it, or the full tier stops being a
# real-behaviour check.
#
# Budgets (speed.md): R1 full <= 300s, R2 fast <= 60s. Measured 2026-10-24 on this VM, three
# consecutive runs each, median: full 5.2s wall (build 1.5s + 37 tests 3.3s, of which the
# browser smoke is 1.9s), fast 2.4s (build 1.5s + 23 tests).
CHECK_CMD="npm test"
CHECK_FAST_CMD="npm run test:fast"
CHECK_TIMEOUT=300
CHECK_FAST_TIMEOUT=180
