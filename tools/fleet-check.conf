# fleet-check gate contract for qrcode (PaulKinlan/qrcode).
#
# This VM is qrcode-only, so this file is the machine-global ~/.fleet/check.conf. It lives in
# the repo as well because the machine file is machine state: if it is rebuilt or lost, every
# landing silently gets no gate (fleet-check --status answers NONE). Copy it back with:
#
#   cp tools/fleet-check.conf ~/.fleet/check.conf
#
# The repo scripts are the source of truth (see the ADR bead qrcode-vyq), and package.json is
# what they implement:
#   fast tier  npm run test:fast  = vite build + node --test over test/unit/** (pure modules:
#                                   no DOM, no server, no network, no browser)
#   full tier  npm test           = those unit tests + test/build/** (post-build dist/
#                                   assertions) + test/browser/** (headless Chrome smoke)
# The fast tier is a strict subset of the full tier (speed.md R2). Both tiers are
# seconds-fast, but the full tier does launch a browser: since bead qrcode-cf0 landed,
# test/browser/smoke.test.mjs serves dist/ on an ephemeral port, drives the camera-free
# file-upload path in headless Chrome with a committed QR fixture, and asserts the decoded
# payload, the service-worker precache and an offline reload. It is hermetic (it fails every
# off-origin request itself, so the tier needs no network), and it carries its own 300s
# node:test timeout, so a hung Chrome cannot consume the R1 budget: CHECK_TIMEOUT below is
# only the outer ceiling. The browser deadlines are load-tolerant rather than tight (bead
# qrcode-4tl): every phase wait is scaled by QR_SNAPPER_BROWSER_TIMEOUT_SCALE (default 4, so Chrome
# startup gets 60s, page boot / decode / worker install 60s, offline reload 80s), because on a
# starved CPU all of them stretched together and tight ones killed runs that were merely slow.
# A genuinely hung Chrome now fails on the 300s runner ceiling, or above it on CHECK_TIMEOUT, so
# it surfaces as a timeout rather than as a red assertion.
# QR_SNAPPER_NO_BROWSER=1 skips the browser file deliberately (for a
# box with no Chrome); the gate must never set it, or the full tier stops being a
# real-behaviour check.
#
# Budgets (speed.md): R1 full <= 300s, R2 fast <= 60s, measured on a QUIET box. Measured 2026-10-24,
# three consecutive runs each, median: full 5.2s wall (build 1.5s + 37 tests 3.3s, of which the
# browser smoke is 1.9s), fast 2.4s (build 1.5s + 23 tests). Measured again 2026-10-27 with the
# VM under CPU steal (load 11-17 on 2 cores, several lanes): vite build alone 215s, the browser
# smoke tier 247s, the fast tier 278s end to end. The tiers did not get slower; the box did.
#
# So the two ceilings below are NOT budgets, they are hang guards: they must sit above the loaded-
# VM cost, or a starved box reports a red gate for code that is fine (beads qrcode-la9, qrcode-rd3,
# and the 180s fast bound that produced exactly that). Keep R1/R2 as the speed budget to judge the
# tiers by on a quiet box; if the full tier needs this ceiling in normal running, the finding is
# machine load, not a licence to relax.
#
# This file mirrors the machine's ~/.fleet/check.conf, which is what fleet-check actually reads
# (CHECK_CONF="${FLEET_CHECK_CONF:-$HOME/.fleet/check.conf}"). Keep the two identical - a rebuild
# from a stale copy silently changes every landing's ceiling.
CHECK_CMD="npm test"
CHECK_FAST_CMD="npm run test:fast"
CHECK_TIMEOUT=900
CHECK_FAST_TIMEOUT=600
